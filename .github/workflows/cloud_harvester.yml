name: Cloud Anime Harvester

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a executar'
        required: true
        type: choice
        options:
          - 'all'
          - 'repair'
          - 'crawl'
        default: 'all'
      ingest_mode:
        description: 'Modo de Ingestão'
        required: true
        type: choice
        options:
          - 'direct'
          - 'dispatch'
        default: 'direct'
      start_page:
        description: 'Página inicial do catálogo (para varredura)'
        required: true
        default: '1'
      max_pages:
        description: 'Quantas páginas varrer (para varredura)'
        required: true
        default: '3'

concurrency:
  group: cloud-harvester
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  harvest_cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Runtime Tools (ffmpeg, rclone)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone curl jq python3-pip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install requests supabase

      - name: Setup Rclone Configuration
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          if [ -n "$RCLONE_CONF_B64" ]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
            echo "[✓] Rclone configurado com sucesso para Google Drive."
          else
            echo "[!] RCLONE_CONFIG_BASE64 não definido (necessário apenas para modo direct)."
          fi

      - name: Run Harvester in GitHub Cloud (Intelligent Gap Detection & Direct Ingest)
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          echo "[*] Iniciando rastreador inteligente de animes..."
          python3 -u smartplay_harvester.py \
            --action "${{ inputs.action }}" \
            --mode "${{ inputs.ingest_mode }}" \
            --start "${{ inputs.start_page }}" \
            --pages "${{ inputs.max_pages }}"
