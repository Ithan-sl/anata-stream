name: Cloud Anime Harvester

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: 'Página inicial do catálogo'
        required: true
        default: '1'
      max_pages:
        description: 'Quantas páginas varrer'
        required: true
        default: '3'

concurrency:
  group: cloud-harvester
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  harvest_cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Harvester in GitHub Cloud (Intelligent Gap Detection)
        env:
          # Usa o Personal Access Token (GH_PAT) para permissão de disparo sem erro 403
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "[*] Iniciando rastreador inteligente com detecção de lacunas..."
          python3 smartplay_harvester.py ${{ inputs.start_page }} ${{ inputs.max_pages }}
